[project]
name = "zhol"
version = "0.1.0"
description = "Which of tomorrow's loads will a restriction hit? Evening-before disruption alerts for European road freight."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "anthropic>=2.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["zhol*"]

[tool.setuptools.package-data]
zhol = ["data/*.json", "data/calendars/*.json"]
