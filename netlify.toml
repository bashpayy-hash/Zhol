# zhol website. Every push rebuilds the beta data with the real engine.
[build]
  publish = "site"
  command = "python scripts/build_site.py"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # only our own scripts and data run here; fonts from Google; no page may frame the site (security check, 9 Nov 2026)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# the radar's old address (it was first called "outlook"): old links and bookmarks still arrive (owner, 9 Nov 2026)
[[redirects]]
  from = "/outlook"
  to = "/radar"
  status = 301
  force = true
[[redirects]]
  from = "/outlook.html"
  to = "/radar"
  status = 301
  force = true
[[redirects]]
  from = "/it/outlook"
  to = "/it/radar"
  status = 301
  force = true
[[redirects]]
  from = "/it/outlook.html"
  to = "/it/radar"
  status = 301
  force = true

# the TEF answers moved to the home page
[[redirects]]
  from = "/answers"
  to = "/"
  status = 301

# the survey opens at once: /q and /q/it are served directly, without the trailing-slash redirect (it cost ~0.5 s)
[[redirects]]
  from = "/q"
  to = "/q/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/q/it"
  to = "/q/it/index.html"
  status = 200
  force = true

# the survey is a short standalone link: /q in English (the default), /q/it in Italian; old links keep working, with their ?src=
[[redirects]]
  from = "/q/en"
  to = "/q"
  status = 301
[[redirects]]
  from = "/q/en/*"
  to = "/q"
  status = 301
[[redirects]]
  from = "/it/sondaggio"
  to = "/q/it"
  status = 301
[[redirects]]
  from = "/it/sondaggio.html"
  to = "/q/it"
  status = 301
[[redirects]]
  from = "/survey"
  to = "/q"
  status = 301
[[redirects]]
  from = "/survey.html"
  to = "/q"
  status = 301

# Italian pages get the Italian "page not found"
[[redirects]]
  from = "/it/*"
  to = "/it/404.html"
  status = 404
