# zhol website. Every push rebuilds the beta data with the real engine.
[build]
  publish = "site"
  command = "python scripts/build_site.py"

[build.environment]
  PYTHON_VERSION = "3.12"

# the assistant, office reports and WhatsApp alerts (docs/16-word-of-mouth.md); Claude through Netlify AI Gateway
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # only our own scripts and data run here; fonts from Google; no page may frame the site (security check, 9 Nov 2026)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# the radar's old address (it was first called "outlook"): old links and bookmarks still arrive (owner, 9 Nov 2026)
[[redirects]]
  from = "/outlook"
  to = "/radar"
  status = 301
  force = true
[[redirects]]
  from = "/outlook.html"
  to = "/radar"
  status = 301
  force = true
[[redirects]]
  from = "/it/outlook"
  to = "/it/radar"
  status = 301
  force = true
[[redirects]]
  from = "/it/outlook.html"
  to = "/it/radar"
  status = 301
  force = true

# the audience page is chapter two of the story now: four menu sections instead of six (owner, 12 Nov 2026)
[[redirects]]
  from = "/audience"
  to = "/story#who"
  status = 301
  force = true
[[redirects]]
  from = "/it/audience"
  to = "/it/story#who"
  status = 301
  force = true

# the TEF answers moved to the home page
[[redirects]]
  from = "/answers"
  to = "/"
  status = 301

# the survey: readable addresses, served directly (no redirect, it cost ~0.5 s): /survey in English, /it/sondaggio in
# Italian (owner, 9 Nov 2026). The first short links /q and /q/it keep working the same way, with their ?src=.
[[redirects]]
  from = "/survey"
  to = "/q/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/it/sondaggio"
  to = "/q/it/index.html"
  status = 200
  force = true
# the survey in German, French and Spanish for the letters abroad (owner, 11 Nov 2026)
[[redirects]]
  from = "/de/umfrage"
  to = "/q/de/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/fr/enquete"
  to = "/q/fr/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/es/encuesta"
  to = "/q/es/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/q"
  to = "/q/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/q/it"
  to = "/q/it/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/survey.html"
  to = "/survey"
  status = 301
[[redirects]]
  from = "/it/sondaggio.html"
  to = "/it/sondaggio"
  status = 301
[[redirects]]
  from = "/q/en"
  to = "/survey"
  status = 301
[[redirects]]
  from = "/q/en/*"
  to = "/survey"
  status = 301

# Italian pages get the Italian "page not found"
[[redirects]]
  from = "/it/*"
  to = "/it/404.html"
  status = 404

# the team's review page: never indexed
[[headers]]
  for = "/d/*"
  [headers.values]
    # files to download (owner, 12 Nov 2026: «дай ссылку чтобы скачать»): saved, not opened, and kept out of search
    Content-Disposition = "attachment"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/review"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
