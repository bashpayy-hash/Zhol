# zhol website. Every push rebuilds the beta data with the real engine.
[build]
  publish = "site"
  command = "python scripts/build_site.py"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# the TEF answers moved to the home page
[[redirects]]
  from = "/answers"
  to = "/"
  status = 301

# the survey is a short standalone link: /q in English (the default), /q/it in Italian; old links keep working, with their ?src=
[[redirects]]
  from = "/q/en"
  to = "/q"
  status = 301
[[redirects]]
  from = "/q/en/*"
  to = "/q"
  status = 301
[[redirects]]
  from = "/it/sondaggio"
  to = "/q/it"
  status = 301
[[redirects]]
  from = "/it/sondaggio.html"
  to = "/q/it"
  status = 301
[[redirects]]
  from = "/survey"
  to = "/q"
  status = 301
[[redirects]]
  from = "/survey.html"
  to = "/q"
  status = 301

# Italian pages get the Italian "page not found"
[[redirects]]
  from = "/it/*"
  to = "/it/404.html"
  status = 404
